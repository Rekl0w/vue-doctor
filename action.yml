name: "Rekl0w Vue Doctor"
description: "Scan Vue codebases for security, performance, correctness, accessibility, and architecture issues"
branding:
  icon: "activity"
  color: "green"

inputs:
  directory:
    description: "Project directory to scan"
    default: "."
  verbose:
    description: "Show every diagnostic"
    default: "false"
  project:
    description: "Workspace project(s) to scan (comma-separated)"
    required: false
  diff:
    description: "Base branch for diff mode when not using pull_request changed-file discovery"
    required: false
  annotations:
    description: "Emit GitHub Actions annotations for every diagnostic"
    default: "true"
  comment:
    description: "Update a sticky Vue Doctor PR comment"
    default: "true"
  non-blocking:
    description: "Always pass the workflow even when Vue Doctor finds blocking diagnostics"
    default: "false"
  experimental-parallel:
    description: "Optional worker count for experimental parallel scanning"
    required: false
  json:
    description: "Write a JSON report file"
    default: "false"
  report-path:
    description: "Path for the JSON report when json is true"
    default: "vue-doctor-report.json"
  markdown:
    description: "Write a Markdown report file"
    default: "false"
  markdown-report-path:
    description: "Path for the Markdown report when markdown is true"
    default: "vue-doctor-report.md"
  sarif:
    description: "Write a SARIF report file"
    default: "false"
  sarif-report-path:
    description: "Path for the SARIF report when sarif is true"
    default: "vue-doctor.sarif"
  github-token:
    description: "GitHub token for PR file discovery and sticky comments"
    required: false
  preset:
    description: "Rule preset: recommended, strict, or design"
    required: false
  baseline:
    description: "Path to a baseline file whose existing diagnostics should be ignored"
    required: false
  update-baseline:
    description: "Path to write the current diagnostics baseline"
    required: false
  fail-on:
    description: "Exit with error code on diagnostics: error, warning, none"
    default: "error"
  offline:
    description: "Accepted for React Doctor parity. Vue Doctor always scores locally."
    default: "false"
  node-version:
    description: "Node.js version to use"
    default: "22"
  version:
    description: "npm version/range of @rekl0w/vue-doctor to run"
    default: "latest"

outputs:
  score:
    description: "Health score (0-100)"
    value: ${{ steps.summary.outputs.score }}
  total-issues:
    description: "Total diagnostics count"
    value: ${{ steps.summary.outputs.total-issues }}
  error-count:
    description: "Error diagnostics count"
    value: ${{ steps.summary.outputs.error-count }}
  warning-count:
    description: "Warning diagnostics count"
    value: ${{ steps.summary.outputs.warning-count }}
  affected-files:
    description: "Affected file count"
    value: ${{ steps.summary.outputs.affected-files }}
  report-path:
    description: "JSON report path when json is true"
    value: ${{ steps.report.outputs.report-path }}
  markdown-report-path:
    description: "Markdown report path when markdown is true"
    value: ${{ steps.markdown-report.outputs.report-path }}
  sarif-report-path:
    description: "SARIF report path when sarif is true"
    value: ${{ steps.sarif-report.outputs.report-path }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - id: pr-files
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const fs = require("fs");
          const path = require("path");
          const outputPath = path.join(process.env.RUNNER_TEMP, "vue-doctor-changed-files.txt");
          try {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            fs.writeFileSync(outputPath, files.map((file) => file.filename).join("\n"));
            core.setOutput("path", outputPath);
            core.info(`Vue Doctor will scan ${files.length} pull request file(s).`);
          } catch (error) {
            core.warning(`Could not list pull request files; Vue Doctor will fall back to diff/full scan. ${error.message}`);
          }

    - id: scan
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_EXPERIMENTAL_PARALLEL: ${{ inputs.experimental-parallel }}
        INPUT_VERSION: ${{ inputs.version }}
        CHANGED_FILES_PATH: ${{ steps.pr-files.outputs.path }}
      run: |
        set +e
        FLAGS=("--json" "--json-compact" "--fail-on" "$INPUT_FAIL_ON")
        if [ "$INPUT_VERBOSE" = "true" ]; then FLAGS+=("--verbose"); fi
        if [ -n "$INPUT_PROJECT" ]; then FLAGS+=("--project" "$INPUT_PROJECT"); fi
        if [ -n "$INPUT_PRESET" ]; then FLAGS+=("--preset" "$INPUT_PRESET"); fi
        if [ -n "$INPUT_BASELINE" ]; then FLAGS+=("--baseline" "$INPUT_BASELINE"); fi
        if [ -n "$INPUT_UPDATE_BASELINE" ]; then FLAGS+=("--update-baseline" "$INPUT_UPDATE_BASELINE"); fi
        if [ "$INPUT_OFFLINE" = "true" ]; then FLAGS+=("--offline"); fi
        if [ -n "$INPUT_EXPERIMENTAL_PARALLEL" ]; then FLAGS+=("--experimental-parallel" "$INPUT_EXPERIMENTAL_PARALLEL"); fi
        if [ -n "$CHANGED_FILES_PATH" ] && [ -s "$CHANGED_FILES_PATH" ]; then
          FLAGS+=("--changed-files-from" "$CHANGED_FILES_PATH")
        elif [ -n "$INPUT_DIFF" ]; then
          FLAGS+=("--diff" "$INPUT_DIFF")
        fi

        REPORT_FILE="${RUNNER_TEMP:-/tmp}/vue-doctor-report-${GITHUB_RUN_ID:-$$}.json"
        PACKAGE_SPEC="@rekl0w/vue-doctor@${INPUT_VERSION:-latest}"
        NO_COLOR=1 npm exec --yes --package "$PACKAGE_SPEC" -- vue-doctor "$INPUT_DIRECTORY" "${FLAGS[@]}" > "$REPORT_FILE"
        STATUS=$?

        node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$REPORT_FILE"
        PARSE_STATUS=$?
        if [ "$PARSE_STATUS" -ne 0 ]; then STATUS=$PARSE_STATUS; fi

        echo "report-file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        exit 0

    - id: summary
      if: always()
      shell: bash
      env:
        REPORT_FILE: ${{ steps.scan.outputs.report-file }}
        COMMENT_FILE: ${{ runner.temp }}/vue-doctor-comment.md
      run: |
        node "$GITHUB_ACTION_PATH/scripts/render-github-action-comment.mjs" "$REPORT_FILE" "$COMMENT_FILE"
        echo "comment-file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"

    - if: ${{ always() && inputs.annotations == 'true' && steps.scan.outputs.report-file != '' }}
      shell: bash
      env:
        REPORT_FILE: ${{ steps.scan.outputs.report-file }}
      run: |
        node "$GITHUB_ACTION_PATH/scripts/render-github-annotations.mjs" "$REPORT_FILE"

    - id: report
      if: ${{ always() && inputs.json == 'true' && steps.scan.outputs.report-file != '' }}
      shell: bash
      env:
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        REPORT_FILE: ${{ steps.scan.outputs.report-file }}
      run: |
        mkdir -p "$(dirname "$INPUT_REPORT_PATH")"
        cp "$REPORT_FILE" "$INPUT_REPORT_PATH"
        echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"

    - id: markdown-report
      if: ${{ always() && inputs.markdown == 'true' }}
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_REPORT_PATH: ${{ inputs.markdown-report-path }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_EXPERIMENTAL_PARALLEL: ${{ inputs.experimental-parallel }}
        INPUT_VERSION: ${{ inputs.version }}
        CHANGED_FILES_PATH: ${{ steps.pr-files.outputs.path }}
      run: |
        mkdir -p "$(dirname "$INPUT_REPORT_PATH")"
        FLAGS=("--markdown" "--fail-on" "none")
        if [ -n "$INPUT_PROJECT" ]; then FLAGS+=("--project" "$INPUT_PROJECT"); fi
        if [ -n "$INPUT_PRESET" ]; then FLAGS+=("--preset" "$INPUT_PRESET"); fi
        if [ -n "$INPUT_BASELINE" ]; then FLAGS+=("--baseline" "$INPUT_BASELINE"); fi
        if [ "$INPUT_OFFLINE" = "true" ]; then FLAGS+=("--offline"); fi
        if [ -n "$INPUT_EXPERIMENTAL_PARALLEL" ]; then FLAGS+=("--experimental-parallel" "$INPUT_EXPERIMENTAL_PARALLEL"); fi
        if [ -n "$CHANGED_FILES_PATH" ] && [ -s "$CHANGED_FILES_PATH" ]; then FLAGS+=("--changed-files-from" "$CHANGED_FILES_PATH"); fi
        npm exec --yes --package "@rekl0w/vue-doctor@${INPUT_VERSION:-latest}" -- vue-doctor "$INPUT_DIRECTORY" "${FLAGS[@]}" > "$INPUT_REPORT_PATH"
        echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"

    - id: sarif-report
      if: ${{ always() && inputs.sarif == 'true' }}
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_REPORT_PATH: ${{ inputs.sarif-report-path }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_EXPERIMENTAL_PARALLEL: ${{ inputs.experimental-parallel }}
        INPUT_VERSION: ${{ inputs.version }}
        CHANGED_FILES_PATH: ${{ steps.pr-files.outputs.path }}
      run: |
        mkdir -p "$(dirname "$INPUT_REPORT_PATH")"
        FLAGS=("--sarif" "--json-compact" "--fail-on" "none")
        if [ -n "$INPUT_PROJECT" ]; then FLAGS+=("--project" "$INPUT_PROJECT"); fi
        if [ -n "$INPUT_PRESET" ]; then FLAGS+=("--preset" "$INPUT_PRESET"); fi
        if [ -n "$INPUT_BASELINE" ]; then FLAGS+=("--baseline" "$INPUT_BASELINE"); fi
        if [ "$INPUT_OFFLINE" = "true" ]; then FLAGS+=("--offline"); fi
        if [ -n "$INPUT_EXPERIMENTAL_PARALLEL" ]; then FLAGS+=("--experimental-parallel" "$INPUT_EXPERIMENTAL_PARALLEL"); fi
        if [ -n "$CHANGED_FILES_PATH" ] && [ -s "$CHANGED_FILES_PATH" ]; then FLAGS+=("--changed-files-from" "$CHANGED_FILES_PATH"); fi
        npm exec --yes --package "@rekl0w/vue-doctor@${INPUT_VERSION:-latest}" -- vue-doctor "$INPUT_DIRECTORY" "${FLAGS[@]}" > "$INPUT_REPORT_PATH"
        echo "report-path=$INPUT_REPORT_PATH" >> "$GITHUB_OUTPUT"

    - if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' && steps.summary.outputs.comment-file != '' }}
      uses: actions/github-script@v7
      env:
        COMMENT_FILE: ${{ steps.summary.outputs.comment-file }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- vue-doctor:summary -->";
          if (!process.env.COMMENT_FILE || !fs.existsSync(process.env.COMMENT_FILE)) return;
          const body = fs.readFileSync(process.env.COMMENT_FILE, "utf8");
          if (!body.trim()) return;
          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const prev = comments.find((comment) => comment.body?.startsWith(marker));
          if (prev) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          }

    - if: ${{ always() && inputs.non-blocking == 'true' && steps.scan.outputs.status != '0' }}
      shell: bash
      run: |
        echo "::notice::Vue Doctor found blocking diagnostics, but non-blocking mode is enabled."

    - if: ${{ always() && inputs.non-blocking != 'true' && steps.scan.outputs.status != '0' }}
      shell: bash
      run: exit "${{ steps.scan.outputs.status }}"
